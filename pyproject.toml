[project]
name = "motion-capture"
version = "2.0.0"
description = "Live motion tracker: OpenCV in Python, camera in the browser."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["capture.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["motion", "server.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
