[project]
name = "handnet-train"
version = "0.1.0"
description = "Training, evaluation and export for the motion-capture hand detector. Never installed in the server image."
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "onnx==1.23.2",
    "opencv-python-headless==5.0.0.93",
    "pycocotools==2.0.11",
    "torch==2.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["handnet", "motion"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["F"]  # torch.nn.functional as F is the convention
